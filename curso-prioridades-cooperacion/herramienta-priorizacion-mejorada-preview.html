function makeSelect(doc,id,options,value){const sel=doc.createElement('select');sel.id=id;options.forEach(o=>{const op=doc.createElement('option');op.value=o.value;op.textContent=o.label;if(o.value===value)op.selected=true;sel.appendChild(op)});return sel}
function patchAlignment(cw){const doc=cw.document,end=doc.getElementById('end'),pn=doc.getElementById('pnpsp'),meta=doc.getElementById('meta');if(!end||!pn||!meta||doc.getElementById('endSelect'))return;const fields=[end.closest('.field'),pn.closest('.field'),meta.closest('.field')];if(fields[0]?.querySelector('label'))fields[0].querySelector('label').textContent='Objetivo general de la Estrategia Nacional de Desarrollo (END)';if(fields[1]?.querySelector('label'))fields[1].querySelector('label').textContent='Política priorizada del PNPSP 2025–2028';if(fields[2]?.querySelector('label'))fields[2].querySelector('label').textContent='Meta presidencial / Meta RD 2036';const oldEnd=end.value,oldPn=pn.value,oldMeta=meta.value;[end,pn,meta].forEach(x=>{x.type='hidden';x.style.display='none'});const endSel=makeSelect(doc,'endSelect',[{value:'',label:'Seleccione'}].concat(END.map(x=>({value:x,label:x}))),oldEnd);end.parentNode.insertBefore(endSel,end.nextSibling);const pnSel=makeSelect(doc,'pnpspSelect',[],oldPn);pn.parentNode.insertBefore(pnSel,pn.nextSibling);const metaSel=makeSelect(doc,'metaSelect',[],oldMeta);meta.parentNode.insertBefore(metaSel,meta.nextSibling);function refresh(){end.value=endSel.value;const policies=endSel.value?(END_TO_PNPSP[endSel.value]||[]):[],metas=endSel.value?(END_TO_META[endSel.value]||[]):[],pv=pn.value,mv=meta.value;pnSel.innerHTML='';[{value:'',label:endSel.value?'No identificada / requiere revisión':'Seleccione primero la END'}].concat(policies.map(x=>({value:x,label:x}))).forEach(o=>{const op=doc.createElement('option');op.value=o.value;op.textContent=o.label;pnSel.appendChild(op)});pnSel.value=policies.includes(pv)?pv:'';metaSel.innerHTML='';[{value:'',label:endSel.value?'No identificada / no aplica':'Seleccione primero la END'}].concat(metas.map(x=>({value:x,label:x}))).forEach(o=>{const op=doc.createElement('option');op.value=o.value;op.textContent=o.label;metaSel.appendChild(op)});metaSel.value=metas.includes(mv)?mv:'';pn.value=pnSel. function patchResult(cw){const doc=cw.document,content=doc.getElementById('stepContent');if(!content)return;const buttons=[...content.querySelectorAll('button')],save=buttons.find(b=>b.textContent.trim()==='Guardar iniciativa'),next=buttons.find(b=>b.textContent.trim()==='Evaluar otra iniciativa'),finalBtn=buttons.find(b=>b.textContent.trim()==='Seleccionar prioridades institucionales');if(save)save.textContent='Guardar en cartera';if(next&&!next.dataset.autosave){next.dataset.autosave='1';next.textContent='Guardar y evaluar otra iniciativa';next.className='btn green';next.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();cw.saveInitiative();setTimeout(()=>{cw.newInitiative();cw.toast('Iniciativa guardada. Puede registrar la siguiente.')},30)},true)}if(finalBtn&&!finalBtn.dataset.autosave){finalBtn.dataset.autosave='1';finalBtn.disabled=false;finalBtn.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();cw.saveInitiative();setTimeout(()=>cw.openFinalSelection(),40)},true)}if(next&&!doc.getElementById('autosaveNote')){const note=doc.createElement('div');note.id='autosaveNote';note.className='help';note.style.marginTop='-6px';note.style.marginBottom='14px';note.textContent='Al pasar a otra iniciativa, la actual se guarda automáticamente en la cartera de propuestas evaluadas.';next.parentElement.insertAdjacentElement('afterend',note)}}
