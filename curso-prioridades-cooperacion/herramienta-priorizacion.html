<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Herramienta de Priorización de Iniciativas de Cooperación</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f7fa}
#tool{width:100%;height:100vh;border:0;display:block}
.consult-backdrop{position:fixed;inset:0;background:rgba(6,28,50,.66);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Arial,Helvetica,sans-serif}
.consult-box{background:#fff;width:min(1050px,100%);max-height:92vh;overflow:auto;border-radius:14px;padding:24px;box-shadow:0 24px 70px rgba(0,0,0,.3);color:#14233a}
.consult-box h2{margin:0;color:#0b2f57} .consult-box p{color:#5c6b7a;font-size:13px}
.consult-table{width:100%;border-collapse:collapse;margin-top:16px;min-width:800px} .consult-table th,.consult-table td{border-bottom:1px solid #dbe3ec;padding:10px;text-align:left;font-size:12px;vertical-align:top} .consult-table th{background:#f2f6fa;color:#0b2f57;font-size:10px;text-transform:uppercase}
.consult-actions{display:flex;gap:8px;flex-wrap:wrap} .consult-btn{border:1px solid #cbd8e5;background:#fff;color:#0b2f57;border-radius:7px;padding:8px 10px;font-weight:700;cursor:pointer} .consult-btn.danger{color:#8c1f2d} .consult-close{float:right;border:0;background:transparent;font-size:24px;cursor:pointer;color:#0b2f57}
</style>
</head>
<body>
<iframe id="tool" src="herramienta-priorizacion-core.html" title="Herramienta de Priorización de Iniciativas de Cooperación"></iframe>
<script>
const END = ["1.1 Administración pública eficiente, transparente y orientada a resultados", "1.2 Imperio de la ley y seguridad ciudadana", "1.3 Democracia participativa y ciudadanía responsable", "1.4 Seguridad y convivencia pacífica", "2.1 Educación de calidad para todos y todas", "2.2 Salud y seguridad social integral", "2.3 Igualdad de derechos y oportunidades", "2.4 Cohesión territorial", "2.5 Vivienda digna en entornos saludables", "2.6 Cultura e identidad nacional en un mundo global", "2.7 Deporte y recreación física para el desarrollo humano", "3.1 Economía articulada, innovadora y ambientalmente sostenible, con crecimiento alto y sostenido y trabajo digno", "3.2 Energía confiable, eficiente y ambientalmente sostenible", "3.3 Competitividad e innovación en un ambiente favorable a la cooperación y la responsabilidad social", "3.4 Empleos suficientes y dignos", "3.5 Estructura productiva sectorial y territorialmente articulada e integrada competitivamente a la economía global", "4.1 Manejo sostenible del medio ambiente", "4.2 Eficaz gestión de riesgos para minimizar pérdidas humanas, económicas y ambientales", "4.3 Adecuada adaptación al cambio climático"];
const PNPSP = ["1. Empleo decente, formal y suficiente", "2. Seguridad ciudadana: hacia una sociedad segura y protegida", "3. Acceso a la salud y la seguridad social", "4. Educación de calidad con equidad", "5. Educación superior, ciencia y tecnología", "6. Población rural y desarrollo agropecuario", "7. Acceso al agua y mejora del recurso", "8. Energía permanente y de calidad", "9. Vivienda digna", "10. Institucionalidad eficiente y democrática", "11. Cultura para una mejor calidad de vida", "12. Turismo", "13. Comercio interno y externo", "14. Desarrollo industrial", "15. Sostenibilidad ambiental y el cambio climático", "16. Políticas públicas territoriales y municipales", "17. Comunicación y seguridad vial"];
const END_TO_PNPSP = {"1.1 Administración pública eficiente, transparente y orientada a resultados": ["10. Institucionalidad eficiente y democrática", "16. Políticas públicas territoriales y municipales"], "1.2 Imperio de la ley y seguridad ciudadana": ["2. Seguridad ciudadana: hacia una sociedad segura y protegida", "10. Institucionalidad eficiente y democrática", "17. Comunicación y seguridad vial"], "1.3 Democracia participativa y ciudadanía responsable": ["10. Institucionalidad eficiente y democrática", "16. Políticas públicas territoriales y municipales"], "1.4 Seguridad y convivencia pacífica": ["2. Seguridad ciudadana: hacia una sociedad segura y protegida", "17. Comunicación y seguridad vial"], "2.1 Educación de calidad para todos y todas": ["4. Educación de calidad con equidad", "5. Educación superior, ciencia y tecnología"], "2.2 Salud y seguridad social integral": ["3. Acceso a la salud y la seguridad social"], "2.3 Igualdad de derechos y oportunidades": ["1. Empleo decente, formal y suficiente", "3. Acceso a la salud y la seguridad social", "4. Educación de calidad con equidad", "5. Educación superior, ciencia y tecnología", "10. Institucionalidad eficiente y democrática", "16. Políticas públicas territoriales y municipales"], "2.4 Cohesión territorial": ["6. Población rural y desarrollo agropecuario", "7. Acceso al agua y mejora del recurso", "9. Vivienda digna", "16. Políticas públicas territoriales y municipales", "17. Comunicación y seguridad vial"], "2.5 Vivienda digna en entornos saludables": ["7. Acceso al agua y mejora del recurso", "9. Vivienda digna", "16. Políticas públicas territoriales y municipales"], "2.6 Cultura e identidad nacional en un mundo global": ["11. Cultura para una mejor calidad de vida"], "2.7 Deporte y recreación física para el desarrollo humano": ["3. Acceso a la salud y la seguridad social", "4. Educación de calidad con equidad", "11. Cultura para una mejor calidad de vida"], "3.1 Economía articulada, innovadora y ambientalmente sostenible, con crecimiento alto y sostenido y trabajo digno": ["1. Empleo decente, formal y suficiente", "6. Población rural y desarrollo agropecuario", "13. Comercio interno y externo", "14. Desarrollo industrial"], "3.2 Energía confiable, eficiente y ambientalmente sostenible": ["8. Energía permanente y de calidad", "15. Sostenibilidad ambiental y el cambio climático"], "3.3 Competitividad e innovación en un ambiente favorable a la cooperación y la responsabilidad social": ["5. Educación superior, ciencia y tecnología", "13. Comercio interno y externo", "14. Desarrollo industrial"], "3.4 Empleos suficientes y dignos": ["1. Empleo decente, formal y suficiente", "13. Comercio interno y externo", "14. Desarrollo industrial"], "3.5 Estructura productiva sectorial y territorialmente articulada e integrada competitivamente a la economía global": ["1. Empleo decente, formal y suficiente", "6. Población rural y desarrollo agropecuario", "12. Turismo", "13. Comercio interno y externo", "14. Desarrollo industrial", "17. Comunicación y seguridad vial"], "4.1 Manejo sostenible del medio ambiente": ["6. Población rural y desarrollo agropecuario", "7. Acceso al agua y mejora del recurso", "15. Sostenibilidad ambiental y el cambio climático"], "4.2 Eficaz gestión de riesgos para minimizar pérdidas humanas, económicas y ambientales": ["7. Acceso al agua y mejora del recurso", "9. Vivienda digna", "15. Sostenibilidad ambiental y el cambio climático", "17. Comunicación y seguridad vial"], "4.3 Adecuada adaptación al cambio climático": ["6. Población rural y desarrollo agropecuario", "7. Acceso al agua y mejora del recurso", "8. Energía permanente y de calidad", "9. Vivienda digna", "12. Turismo", "15. Sostenibilidad ambiental y el cambio climático"]};
const PRESIDENTIAL = [{"id":"1","priority":"1. Salud y larga vida","meta":"Aumentar la esperanza de vida al nacer de 75 a 77 años.","programs":["Construcción Hospitales Traumatológicos","Estrategia HEARTS","Programa HEARTS","Salud Materno Neonatal","Observación de las prácticas clínicas de los servicios materno infantiles"]},{"id":"2","priority":"2. Seguridad y libertad","meta":"Disminuir la tasa de homicidios por cada 100 mil habitantes de 11.6 a menos de 8.","programs":["Proyecto de la nueva ley orgánica de la reforma policial","Modernización administrativa y financiera de la Policía Nacional","Modernización del desarrollo humano y modelo de gestión humana de la Policía Nacional","Plan 20,000 nuevos policías en las calles","Modernización educativa para profesionalizar la actuación de los policías","Modernización operativa para la protección ciudadana y la lucha contra el crimen"]},{"id":"3","priority":"3. Vivienda y servicios básicos","meta":"Disminuir el déficit cualitativo de la vivienda de 32.2% a 21.9%.","programs":["Plan Dominicana se reconstruye","Ampliación acueducto, Santiago","Reconstrucción acueducto, Puerto Plata","Construcción acueducto, La Vega","Ampliación acueducto, S.D.N.","Ampliación acueducto, Santiago R.","Programa llevando luz","Programa agua y luz"]},{"id":"4","priority":"4. Aumento de la clase media y disminución de la pobreza","meta":"Aumentar el peso de la clase media en la población de 40% a 50%.","programs":[]},{"id":"5","priority":"5. Mayor crecimiento económico","meta":"Aumentar el PIB per cápita de US$11 mil a US$15 mil.","programs":[]},{"id":"6","priority":"6. Mayor empleo de calidad e inclusivo","meta":"Aumentar la tasa de formalidad en el empleo de 44% a 50%.","programs":[]},{"id":"7","priority":"7. Educación de calidad alineada a los sectores productivos","meta":"Aumentar el promedio de años efectivos de aprendizaje de 6.3 a 7.1.","programs":["Entrega de 50,000 becas alineadas al sector productivo","140,000 jóvenes en politécnicos según demandas de desarrollo productivo","400,000 niños y niñas de 3 a 5 años en educación inicial de calidad","Desarrollo infantil para niños y niñas de 0 a 4 años y 11 meses"]},{"id":"8","priority":"8. Disminución de la pobreza rural","meta":"Disminuir el índice de pobreza multidimensional rural de 20% a 15%.","programs":[]},{"id":"9","priority":"9. Aumentar la resiliencia ante choques climáticos","meta":"Aumentar el porcentaje de hogares con IVACC bajo de 61.8% a 75%.","programs":[]},{"id":"10","priority":"10. Mayor efectividad del Gobierno","meta":"Aumentar el índice de efectividad del Gobierno de 52.6 a 61.","programs":[]}];
const frame=document.getElementById('tool');
function escHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function makeSelect(doc,id,options,value){const sel=doc.createElement('select');sel.id=id;sel.dataset.enhanced='1';options.forEach(o=>{const op=doc.createElement('option');op.value=o.value;op.textContent=o.label;if(o.value===value)op.selected=true;sel.appendChild(op);});return sel;}
function patchAlignment(cw){
 const doc=cw.document; const end=doc.getElementById('end'),pn=doc.getElementById('pnpsp'),meta=doc.getElementById('meta');
 if(!end||!pn||!meta||doc.getElementById('endSelect'))return;
 const fields=[end.closest('.field'),pn.closest('.field'),meta.closest('.field')];
 if(fields[0]?.querySelector('label')) fields[0].querySelector('label').textContent='Objetivo general de la Estrategia Nacional de Desarrollo (END)';
 if(fields[1]?.querySelector('label')) fields[1].querySelector('label').textContent='Política priorizada del PNPSP 2025–2028';
 if(fields[2]?.querySelector('label')) fields[2].querySelector('label').textContent='Alineación con prioridades y metas presidenciales';
 const oldEnd=end.value,oldPn=pn.value,oldMeta=meta.value; [end,pn,meta].forEach(x=>{x.type='hidden';x.style.display='none';});
 const endSel=makeSelect(doc,'endSelect',[{value:'',label:'Seleccione'}].concat(END.map(x=>({value:x,label:x}))),oldEnd); end.parentNode.insertBefore(endSel,end.nextSibling);
 const pnSel=makeSelect(doc,'pnpspSelect',[{value:'',label:'Seleccione primero la END'}],''); pn.parentNode.insertBefore(pnSel,pn.nextSibling);
 const prioritySel=makeSelect(doc,'presPriority',[{value:'',label:'Seleccione prioridad de Gobierno'}].concat(PRESIDENTIAL.map(x=>({value:x.id,label:x.priority}))), '');
 const metaSel=makeSelect(doc,'presMeta',[{value:'',label:'Seleccione primero la prioridad'}], '');
 const programSel=makeSelect(doc,'presProgram',[{value:'',label:'Seleccione primero la meta'}], '');
 const block=doc.createElement('div');block.id='presidentialBlock';block.innerHTML='<div class="help" style="margin-bottom:8px">Seleccione la prioridad, la meta y, cuando el boletín identifica programas específicos, el programa/proyecto gubernamental relacionado. Esto permite documentar una alineación sustantiva y no solo temática.</div>';
 const f1=doc.createElement('div');f1.className='field';f1.innerHTML='<label>Prioridad de Gobierno 2024–2028</label>';f1.appendChild(prioritySel);
 const f2=doc.createElement('div');f2.className='field';f2.innerHTML='<label>Meta priorizada asociada</label>';f2.appendChild(metaSel);
 const f3=doc.createElement('div');f3.className='field';f3.innerHTML='<label>Programa, proyecto o iniciativa gubernamental vinculada</label>';f3.appendChild(programSel);const ph=doc.createElement('div');ph.className='help';ph.id='programHelp';f3.appendChild(ph);
 block.appendChild(f1);block.appendChild(f2);block.appendChild(f3); fields[2].appendChild(block);
 function refreshPn(){end.value=endSel.value;const policies=endSel.value?(END_TO_PNPSP[endSel.value]||[]):[];const pv=pn.value;pnSel.innerHTML='';[{value:'',label:endSel.value?'Seleccione / no identificada':'Seleccione primero la END'}].concat(policies.map(x=>({value:x,label:x}))).forEach(o=>{const op=doc.createElement('option');op.value=o.value;op.textContent=o.label;pnSel.appendChild(op)});if(policies.includes(pv))pnSel.value=pv;else pnSel.value='';pn.value=pnSel.value;}
 function refreshPres(){const item=PRESIDENTIAL.find(x=>x.id===prioritySel.value);metaSel.innerHTML='';programSel.innerHTML='';if(!item){metaSel.add(new Option('Seleccione primero la prioridad',''));programSel.add(new Option('Seleccione primero la meta',''));meta.value='';doc.getElementById('programHelp').textContent='';return;}metaSel.add(new Option(item.meta,item.meta));metaSel.value=item.meta;const programs=item.programs||[];if(programs.length){programSel.add(new Option('Seleccione el programa/proyecto vinculado',''));programs.forEach(x=>programSel.add(new Option(x,x)));doc.getElementById('programHelp').textContent='El boletín de metas priorizadas identifica estos programas/proyectos para esta meta.';}else{programSel.add(new Option('El boletín no lista un programa específico para esta meta',''));doc.getElementById('programHelp').textContent='Para esta meta, el boletín consultado no presenta un listado específico de programas. La alineación se documenta con la prioridad y la meta.';}syncMeta();}
 function syncMeta(){const item=PRESIDENTIAL.find(x=>x.id===prioritySel.value);if(!item){meta.value='';return;}let v=item.priority+' | Meta: '+item.meta;if(programSel.value)v+=' | Programa: '+programSel.value;meta.value=v;}
 endSel.addEventListener('change',()=>{pn.value='';refreshPn();});pnSel.addEventListener('change',()=>pn.value=pnSel.value);prioritySel.addEventListener('change',refreshPres);metaSel.addEventListener('change',syncMeta);programSel.addEventListener('change',syncMeta);refreshPn();
 if(oldMeta){const found=PRESIDENTIAL.find(x=>oldMeta.includes(x.meta)||oldMeta.includes(x.priority));if(found){prioritySel.value=found.id;refreshPres();const prog=(found.programs||[]).find(x=>oldMeta.includes(x));if(prog)programSel.value=prog;syncMeta();}}
 const h1=fields[1]?.querySelector('.help');if(h1)h1.textContent='Las políticas se filtran según el objetivo de la END seleccionado. Valor: hasta 15 puntos.';
 const h2=fields[2]?.querySelector('.help');if(h2)h2.textContent='La alineación presidencial se registra mediante prioridad y meta; cuando el boletín identifica programas, puede seleccionar el correspondiente. Valor: hasta 10 puntos.';
}
function autoSaveCurrent(cw){cw.calculate();const s=JSON.parse(JSON.stringify(cw.state.current));let ix=cw.state.initiatives.findIndex(x=>x.id===s.id);if(ix>=0)cw.state.initiatives[ix]=s;else cw.state.initiatives.push(s);cw.state.initiatives.sort((a,b)=>b.total-a.total);cw.saveLocal();}
function openConsultation(cw){
 autoSaveCurrent(cw);const old=document.getElementById('consultation');if(old)old.remove();const items=cw.state.initiatives;
 const box=document.createElement('div');box.id='consultation';box.className='consult-backdrop';
 const rows=items.map((x,i)=>`<tr><td>${i+1}</td><td><b>${escHtml(x.title)}</b></td><td><b>${x.total}/100</b></td><td>${escHtml(x.orientation||'')}</td><td><div class="consult-actions"><button class="consult-btn" data-review="${x.id}">Consultar</button><button class="consult-btn danger" data-discard="${x.id}">Descartar</button></div></td></tr>`).join('');
 box.innerHTML=`<div class="consult-box"><button class="consult-close" title="Cerrar">×</button><h2>Consultar priorización</h2><p>Revise las iniciativas evaluadas y el orden técnico resultante. En esta etapa puede consultar, revisar o descartar propuestas. <b>La selección final de iniciativas se realizará en un ejercicio posterior.</b></p><div style="overflow:auto"><table class="consult-table"><thead><tr><th>Orden</th><th>Iniciativa</th><th>Puntaje</th><th>Orientación</th><th>Acciones</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
 document.body.appendChild(box);box.querySelector('.consult-close').onclick=()=>box.remove();box.addEventListener('click',e=>{if(e.target===box)box.remove();const r=e.target.closest('[data-review]');if(r){const id=r.dataset.review;box.remove();cw.loadInitiative(id);}const d=e.target.closest('[data-discard]');if(d){const id=d.dataset.discard;if(confirm('¿Desea descartar esta iniciativa de la consulta de priorización?')){cw.deleteInitiative(id);box.remove();openConsultation(cw);}}});
}
function patchResult(cw){
 const doc=cw.document,content=doc.getElementById('stepContent');if(!content)return;const buttons=[...content.querySelectorAll('button')];
 const save=buttons.find(b=>['Guardar iniciativa','Guardar en cartera'].includes(b.textContent.trim()));const next=buttons.find(b=>['Evaluar otra iniciativa','Guardar y evaluar otra iniciativa'].includes(b.textContent.trim()));const finalBtn=buttons.find(b=>['Seleccionar prioridades institucionales','Consultar priorización'].includes(b.textContent.trim()));
 if(save)save.style.display='none';
 if(next&&!next.dataset.consultFlow){next.dataset.consultFlow='1';next.textContent='Evaluar otra iniciativa';next.className='btn green';next.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();autoSaveCurrent(cw);cw.newInitiative();cw.toast('Iniciativa guardada automáticamente. Puede registrar la siguiente.');},true);}
 if(finalBtn&&!finalBtn.dataset.consultFlow){finalBtn.dataset.consultFlow='1';finalBtn.textContent='Consultar priorización';finalBtn.disabled=false;finalBtn.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();openConsultation(cw);},true);}
 [...content.querySelectorAll('button')].forEach(b=>{if(b.textContent.trim()==='Eliminar')b.textContent='Descartar';});
 let note=doc.getElementById('autosaveNote');if(!note&&next){note=doc.createElement('div');note.id='autosaveNote';note.className='callout';note.style.marginTop='10px';note.innerHTML='<b>Guardado automático:</b> al evaluar otra iniciativa o consultar la priorización, la iniciativa actual se incorpora automáticamente al listado de propuestas evaluadas.';next.parentElement.insertAdjacentElement('afterend',note);}
 const head=content.querySelector('.section-head p');if(head&&cw.state.step===7)head.textContent='Revise la valoración de la iniciativa. Puede editarla, evaluar otra o consultar el orden técnico de todas las propuestas. La selección final se realizará en un ejercicio posterior.';
}
function patchPortfolio(cw){const doc=cw.document;[...doc.querySelectorAll('button')].forEach(b=>{if(b.textContent.trim()==='Eliminar')b.textContent='Descartar';});}
function enhance(){const cw=frame.contentWindow;if(!cw||!cw.document)return;patchAlignment(cw);patchResult(cw);patchPortfolio(cw);}
frame.addEventListener('load',()=>{const cw=frame.contentWindow;enhance();const obs=new MutationObserver(()=>enhance());obs.observe(cw.document.body,{childList:true,subtree:true});cw.document.addEventListener('input',()=>setTimeout(enhance,0),true);});
</script>
</body>
</html>
